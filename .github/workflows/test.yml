name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install ripgrep for offline search tests
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Test Effect simplification rules
        run: bun run test:effect-simplification-rules

      - name: Check Effect simplifications
        run: bun run lint:effect-simplifications

      - name: Test tooling configuration
        working-directory: packages/script
        run: bun test test/vite-tasks.test.ts

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Vite+ tasks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-${{ runner.os }}-${{ hashFiles('bun.lock', '**/vite.config.*', 'script/vite-tasks.ts', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            vp-${{ runner.os }}-${{ hashFiles('bun.lock', '**/vite.config.*', 'script/vite-tasks.ts', '**/package.json') }}-
            vp-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          # The runners have four vCPUs, and each Bun test process performs its own concurrent work.
          # Vite+ has no --affected flag; unchanged tasks are skipped by its input cache.
          GITHUB_ACTIONS=false bun run vp run -r --concurrency-limit 3 workspace:test

      - name: Verify published codemode package
        working-directory: packages/codemode
        run: bun run script/publish.ts --dry-run

      - name: Verify compiled service lifecycle
        if: always()
        timeout-minutes: 10
        working-directory: packages/cli
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      - name: Setup Node build runtime
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Verify Node build
        if: always()
        timeout-minutes: 15
        working-directory: packages/cli
        run: |
          bun run script/build-node.ts --single --skip-install --outdir=dist/node
          bun run script/service-smoke.ts --node

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated CLI schema
        working-directory: packages/cli
        run: bun script/schema.ts cli.schema.json --check
