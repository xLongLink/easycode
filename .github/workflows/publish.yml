name: Release easycode
run-name: easycode ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v)"
        required: true
        default: "0.0.0"
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=* --cpu=*
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          bun -e '
            const version = process.env.RELEASE_VERSION.replace(/^v/, "")
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Expected a stable version such as 0.0.0")
            if (version !== (await Bun.file("package.json").json()).version) throw new Error("Release version must match package.json")
            await Bun.write(process.env.GITHUB_ENV, `OPENCODE_VERSION=${version}\nOPENCODE_CHANNEL=latest\n`)
          '
      - name: Check
        run: bun run check
      - name: Test CLI and installer
        working-directory: packages/cli
        run: bun test --timeout 30000 --only-failures
      - name: Build easycode binaries
        run: bun packages/cli/script/build.ts --skip-install
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          GH_TOKEN: ${{ github.token }}
      - name: Verify compiled service lifecycle
        working-directory: packages/cli
        run: bun script/service-smoke.ts
      - name: Package release assets
        run: |
          bun packages/cli/script/publish.ts --dry-run
          mkdir -p release
          cp packages/cli/dist/easycode-*.tar.gz release/
          cp install release/install
          cd release
          sha256sum easycode-*.tar.gz install > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: easycode-release
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: easycode-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version="${RELEASE_VERSION#v}"
          gh release create "v${version}" release/* \
            --target "$RELEASE_COMMIT" \
            --title "easycode v${version}" \
            --notes ""
